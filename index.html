<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a2036" />
    <title>Date Night</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a2036; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      /* Stats.js panel sits top-left; nudge it so it never hides under a notch. */
      #stats-container { position: fixed; top: 8px; right: 8px; z-index: 100; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="stats-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
